[package]
name = "axion-console"
version = "9.4.1"
edition = "2021"
description = "AXION-9 desktop shell — lightweight Tauri runtime with sysinfo telemetry"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.31"

[features]
custom-protocol = ["tauri/custom-protocol"]
